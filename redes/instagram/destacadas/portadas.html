<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portadas de destacadas</title>
<!--
  Portadas de las destacadas de Instagram de Mehari We.
  - Sin parámetros: muestra la galería (cómo se ven en el perfil y las portadas a tamaño reducido).
  - ?c=<id>&v=<variante>: dibuja una sola portada a 1080×1920 para exportarla a PNG
    (ver README.md de esta carpeta). Ejemplo: portadas.html?c=bodas&v=naranja
  Colores: los de marca/tokens.css. Los iconos son trazos propios, sin logos de terceros.
-->
<style>
  :root {
    --naranja: #EE7D1F;
    --beige: #DCC6A0;
    --cal: #F7F1E6;
    --tinta: #2B211A;
    --naranja-oscuro: #C2560E;
    --azahar: #FFFCF5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cal); color: var(--tinta); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

  /* Modo portada: lienzo de story 1080×1920 */
  body.unica { width: 1080px; height: 1920px; overflow: hidden; }
  .lienzo { width: 1080px; height: 1920px; display: flex; align-items: center; justify-content: center; }
  .lienzo svg { width: 560px; height: 560px; }

  /* Modo galería */
  .galeria { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .nota { font-size: 14px; opacity: .75; margin-bottom: 28px; max-width: 70ch; line-height: 1.45; }
  .variante { margin-bottom: 40px; }
  .variante h2 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
  .perfil { background: #fff; border-radius: 14px; padding: 18px 12px; display: flex; gap: 14px; overflow-x: auto; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: #121212; color: #f2f2f2; }
    :root:not([data-theme="light"]) .perfil { background: #000; }
  }
  :root[data-theme="dark"] body { background: #121212; color: #f2f2f2; }
  :root[data-theme="dark"] .perfil { background: #000; }
  .destacada { flex: 0 0 auto; width: 76px; text-align: center; font-size: 12px; }
  .aro { width: 70px; height: 70px; border-radius: 50%; border: 1px solid #c7c7c7; padding: 3px; margin: 0 auto 6px; }
  .aro .disco { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .aro svg { width: 58%; height: 58%; }
  .destacada span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .luego { opacity: .45; }
  .tiras { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 14px; }
  .tira { aspect-ratio: 9 / 16; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; }
  .tira svg { width: 52%; }
  .tira::after { content: ""; position: absolute; width: 74%; aspect-ratio: 1; border: 1px dashed currentColor; border-radius: 50%; opacity: .35; }
</style>
</head>
<body>
<!-- Iconos: viewBox -200 -200 400 400, trazo con currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-bodas" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-52" cy="30" r="88"/>
      <circle cx="52" cy="30" r="88"/>
      <path d="M52 -58 l-26 -30 l12 -22 h28 l12 22 z"/>
    </g>
    <g id="i-volante" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <circle r="150"/>
      <circle r="38"/>
      <path d="M-38 0 H-150 M38 0 H150 M0 38 V150"/>
    </g>
    <g id="i-mehari" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <!-- Silueta lateral del Méhari con capota y las costillas de la carrocería -->
      <path d="M-185 70 H-159.5 A60 60 0 0 1 -50.5 70 H55.5 A60 60 0 0 1 164.5 70 H185 V30 Q182 -8 120 -15 H-185 Z"/>
      <path d="M58 -15 L82 -105 H-118 L-140 -15"/>
      <path d="M-160 12 H140 M-30 42 H32"/>
      <circle cx="-105" cy="95" r="40"/>
      <circle cx="110" cy="95" r="40"/>
    </g>
    <g id="i-reservar" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-140" y="-110" width="280" height="250" rx="34"/>
      <path d="M-140 -36 H140"/>
      <path d="M-70 -150 V-80 M70 -150 V-80"/>
      <path d="M-58 48 l40 40 l82 -86"/>
    </g>
    <g id="i-preguntas" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-100 -140 H100 a50 50 0 0 1 50 50 V40 a50 50 0 0 1 -50 50 H-10 L-80 150 V90 H-100 a50 50 0 0 1 -50 -50 V-90 a50 50 0 0 1 50 -50 z"/>
      <path d="M-36 -52 a36 36 0 1 1 52 32 c-14 8 -16 16 -16 30"/>
      <circle cx="0" cy="48" r="7" fill="currentColor"/>
    </g>
    <g id="i-sevilla" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 -160 a72 72 0 0 1 72 72 c0 58 -72 124 -72 124 s-72 -66 -72 -124 a72 72 0 0 1 72 -72 z"/>
      <circle cx="70" cy="-88" r="22"/>
      <path d="M-150 150 C -60 150 -130 60 -30 60 S 40 120 70 80" stroke-dasharray="0.1 42"/>
    </g>
    <g id="i-parejas" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 130 C -170 20 -150 -120 -60 -120 C -22 -120 0 -92 0 -70 C 0 -92 22 -120 60 -120 C 150 -120 170 20 0 130 Z"/>
    </g>
    <g id="i-prensa" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-150" y="-120" width="300" height="240" rx="26"/>
      <path d="M-100 -62 H100"/>
      <rect x="-100" y="-14" width="80" height="84" rx="8"/>
      <path d="M20 -6 H100 M20 34 H100 M20 74 H100"/>
    </g>
  </defs>
</svg>

<div id="app"></div>

<script>
  // Orden en el perfil. Las dos últimas se añaden cuando haya material (ver README.md).
  const DESTACADAS = [
    { id: 'bodas', nombre: 'Bodas', icono: 'i-bodas' },
    { id: 'volante', nombre: 'Al volante', icono: 'i-volante' },
    { id: 'mehari', nombre: 'Los Méhari', icono: 'i-mehari' },
    { id: 'reservar', nombre: 'Reservar', icono: 'i-reservar' },
    { id: 'preguntas', nombre: 'Preguntas', icono: 'i-preguntas' },
    { id: 'sevilla', nombre: 'Sevilla', icono: 'i-sevilla' },
    { id: 'parejas', nombre: 'Parejas', icono: 'i-parejas', luego: true },
    { id: 'prensa', nombre: 'Prensa', icono: 'i-prensa', luego: true },
  ];
  const VARIANTES = {
    naranja: { fondo: 'var(--naranja)', trazo: 'var(--azahar)', titulo: 'A · Naranja Méhari con trazo azahar (recomendada)' },
    cal: { fondo: 'var(--cal)', trazo: 'var(--naranja-oscuro)', titulo: 'B · Cal con trazo naranja tostado' },
    beige: { fondo: 'var(--beige)', trazo: 'var(--tinta)', titulo: 'C · Beige arena con trazo tinta' },
  };

  const icono = (id) => `<svg viewBox="-200 -200 400 400" aria-hidden="true"><use href="#${id}"/></svg>`;
  const params = new URLSearchParams(location.search);
  const app = document.getElementById('app');

  if (params.has('c')) {
    const d = DESTACADAS.find((x) => x.id === params.get('c')) || DESTACADAS[0];
    const v = VARIANTES[params.get('v')] || VARIANTES.naranja;
    document.body.className = 'unica';
    app.innerHTML = `<div class="lienzo" style="background:${v.fondo};color:${v.trazo}">${icono(d.icono)}</div>`;
  } else {
    app.innerHTML = `<main class="galeria">
      <h1>Portadas de destacadas · Mehari We</h1>
      <p class="nota">Así se ven en el perfil (círculo de unos 60 px) y las portadas completas a 1080×1920.
      El círculo discontinuo marca la zona que recorta Instagram. Las dos atenuadas se añaden cuando
      haya testimonios por escrito y permiso de prensa.</p>
      ${Object.values(VARIANTES).map((v) => `
        <section class="variante">
          <h2>${v.titulo}</h2>
          <div class="perfil">${DESTACADAS.map((d) => `
            <div class="destacada${d.luego ? ' luego' : ''}">
              <div class="aro"><div class="disco" style="background:${v.fondo};color:${v.trazo}">${icono(d.icono)}</div></div>
              <span>${d.nombre}</span>
            </div>`).join('')}
          </div>
          <div class="tiras">${DESTACADAS.map((d) => `
            <div class="tira${d.luego ? ' luego' : ''}" style="background:${v.fondo};color:${v.trazo}">${icono(d.icono)}</div>`).join('')}
          </div>
        </section>`).join('')}
    </main>`;
  }
</script>
</body>
</html>
