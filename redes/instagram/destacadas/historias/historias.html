<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historias de destacadas</title>
<!--
  Historias de las destacadas de Mehari We (1080×1920).
  - Sin parámetros: galería con todas las historias en pequeño.
  - ?id=<id>: dibuja una historia a tamaño real para exportarla (ver README.md).
  Fotos: limpias/ (las genera preparar.py; no se suben a Git).
  Textos: solo datos del brief. Lo que falta del cliente no se escribe (CLAUDE.md §4.3).
-->
<style>
  @font-face { font-family: "Fraunces"; src: url("fonts/Fraunces.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Jost"; src: url("fonts/Jost.woff2") format("woff2"); font-weight: 300 800; }
  :root {
    --naranja: #EE7D1F; --beige: #DCC6A0; --cal: #F7F1E6; --tinta: #2B211A;
    --naranja-oscuro: #C2560E; --azahar: #FFFCF5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cal); color: var(--tinta); font-family: "Jost", Arial, sans-serif; }

  .historia { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--cal); color: var(--tinta); }
  .historia img { display: block; }

  /* Bloque de texto común. Zonas seguras: 250 px arriba y 300 px abajo (interfaz de Instagram) */
  .bloque { position: absolute; left: 84px; right: 84px; }
  .kicker { font-weight: 600; font-size: 30px; letter-spacing: .24em; text-transform: uppercase; margin-bottom: 26px; }
  .titulo { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 100px; line-height: 1.02; letter-spacing: -.01em; }
  .cuerpo { font-size: 44px; line-height: 1.36; margin-top: 30px; font-weight: 400; }
  .ingles { font-size: 36px; line-height: 1.35; margin-top: 18px; font-style: italic; opacity: .85; }
  .cta { display: inline-block; margin-top: 44px; font-weight: 600; font-size: 40px; padding: 24px 46px; border-radius: 999px; background: var(--naranja); color: var(--tinta); }
  .nota-sticker { margin-top: 28px; font-size: 30px; opacity: .7; }

  /* Foto a sangre */
  .foto > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(43,33,26,.35) 0%, rgba(43,33,26,0) 18%, rgba(43,33,26,0) 42%, rgba(43,33,26,.88) 82%, rgba(43,33,26,.94) 100%); }
  .foto.arriba::after { background: linear-gradient(0deg, rgba(43,33,26,.3) 0%, rgba(43,33,26,0) 22%, rgba(43,33,26,0) 40%, rgba(43,33,26,.82) 60%, rgba(43,33,26,.9) 100%); }
  .foto .bloque { bottom: 330px; z-index: 1; color: var(--azahar); }
  .foto.arriba .bloque { bottom: auto; top: 250px; }
  .foto .kicker { color: var(--beige); }

  /* Tarjeta: foto arriba con margen, texto debajo */
  .tarjeta .marco { position: absolute; left: 70px; right: 70px; top: 250px; border-radius: 36px; overflow: hidden; }
  .tarjeta .marco img { width: 100%; height: 100%; object-fit: cover; }
  .tarjeta .bloque { bottom: 320px; }
  .tarjeta .kicker { color: var(--naranja-oscuro); }

  /* Varias fotos con etiqueta */
  .varias .bloque { top: 250px; }
  .varias .kicker { color: var(--naranja-oscuro); }
  .varias .titulo { font-size: 84px; }
  .rejilla { position: absolute; left: 70px; right: 70px; bottom: 300px; display: flex; flex-direction: column; gap: 22px; }
  .celda { position: relative; border-radius: 30px; overflow: hidden; }
  .celda img { width: 100%; height: 100%; object-fit: cover; }
  .etiqueta { position: absolute; left: 24px; bottom: 24px; background: var(--azahar); color: var(--tinta); font-weight: 600; font-size: 34px; padding: 12px 28px; border-radius: 999px; }

  /* Solo texto */
  .texto .bloque { top: 300px; }
  .texto.naranja { background: var(--naranja); }
  .texto.naranja .kicker { color: var(--azahar); }
  .texto.tinta { background: var(--tinta); color: var(--azahar); }
  .texto.tinta .kicker { color: var(--beige); }
  .texto.cal .kicker { color: var(--naranja-oscuro); }
  .lista { list-style: none; margin-top: 46px; }
  .lista li { font-size: 46px; line-height: 1.3; padding: 22px 0 22px 64px; position: relative; border-top: 2px solid currentColor; border-color: rgba(43,33,26,.18); }
  .texto.tinta .lista li { border-color: rgba(255,252,245,.2); }
  .lista li::before { content: ""; position: absolute; left: 6px; top: 40px; width: 26px; height: 14px; border-radius: 4px; background: currentColor; opacity: .85; }
  .texto.tinta .cta, .texto.cal .cta { background: var(--naranja); color: var(--tinta); }
  .texto.naranja .cta { background: var(--tinta); color: var(--azahar); }

  /* Galería */
  .galeria { padding: 24px 16px 64px; max-width: 1400px; margin: 0 auto; }
  .galeria h1 { font-size: 22px; margin-bottom: 6px; }
  .galeria p { font-size: 14px; opacity: .75; margin-bottom: 20px; }
  .galeria h2 { font-size: 16px; margin: 26px 0 10px; }
  .fila { display: flex; gap: 12px; flex-wrap: wrap; }
  .mini { width: 216px; height: 384px; overflow: hidden; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .mini .historia { transform: scale(.2); transform-origin: 0 0; }
  .mini-id { font-size: 12px; margin-top: 4px; opacity: .7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: #161210; color: #f3eee6; }
  }
  :root[data-theme="dark"] body { background: #161210; color: #f3eee6; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const WA = 'WhatsApp · 625 06 42 93';
  const WA_EN = 'WhatsApp · +34 625 06 42 93';

  // Una entrada por historia, en el orden en que se suben a cada destacada.
  const SECCIONES = [
    { nombre: '1 · Bodas', historias: [
      { id: '01-bodas-1', tipo: 'tarjeta', foto: 'F2131', alto: 620, kicker: 'Bodas',
        titulo: 'Así sale una boda en Méhari', cuerpo: 'Salidas de iglesia, llegadas a la hacienda y fotos que no salen con otro coche.' },
      { id: '01-bodas-2', tipo: 'foto', foto: 'F1958', foco: '58% 50%', kicker: 'Bodas',
        titulo: 'Esa cara al subir', cuerpo: 'Lo que pasa cuando la novia ve el coche a la salida.' },
      { id: '01-bodas-3', tipo: 'foto', foto: 'F1853', foco: '55% 50%', arriba: true, kicker: 'Bodas',
        titulo: 'Las fotos que os vais a llevar', cuerpo: 'El Méhari entra en la sesión como uno más.' },
      { id: '01-bodas-4', tipo: 'tarjeta', foto: 'F2182', alto: 690, kicker: 'Bodas',
        titulo: 'Con las flores de vuestra boda', cuerpo: 'Las cestas de detrás van llenas y el techo, como os guste.' },
      { id: '01-bodas-5', tipo: 'foto', foto: 'F1465', foco: '40% 50%', kicker: 'Bodas',
        titulo: 'Naranja o beige', cuerpo: 'Tenemos dos. Elegís el que mejor va con vuestra boda.' },
      { id: '01-bodas-6', tipo: 'texto', fondo: 'naranja', kicker: 'Bodas 2027',
        titulo: '¿Os casáis en 2027?', cuerpo: 'Escribidnos vuestra fecha y os decimos si la tenemos libre.', cta: WA, sticker: true },
    ]},
    { nombre: '2 · Al volante', historias: [
      { id: '02-volante-1', tipo: 'foto', foto: 'F0022', foco: '55% 50%', kicker: 'Al volante',
        titulo: '¿Y si lo conducís vosotros?', cuerpo: 'Salís de la iglesia y las llaves son vuestras.' },
      { id: '02-volante-2', tipo: 'foto', foto: 'F0329', foco: '72% 50%', kicker: 'Al volante',
        titulo: 'Antes, una clase', cuerpo: 'Antes de la boda os damos una clase de conducción, para que ese día vayáis tranquilos.' },
      { id: '02-volante-3', tipo: 'foto', foto: 'F1018', foco: '50% 40%', kicker: 'Al volante',
        titulo: 'Conduce quien queráis', cuerpo: 'Los novios o alguien cercano: un hermano, una amiga, el padrino.' },
      { id: '02-volante-4', tipo: 'foto', foto: 'F1508', foco: '62% 50%', kicker: 'Al volante',
        titulo: '¿Preferís ir de pasajeros?', cuerpo: 'También vamos con chófer. Vosotros solo tenéis que saludar.' },
      { id: '02-volante-5', tipo: 'texto', fondo: 'tinta', kicker: 'Al volante',
        titulo: '¿Conducís u os llevamos?', cuerpo: 'Contádnoslo por WhatsApp junto con la fecha de la boda.', cta: WA, sticker: true },
    ]},
    { nombre: '3 · Los Méhari', historias: [
      { id: '03-mehari-1', tipo: 'varias', kicker: 'Los Méhari', titulo: 'Uno naranja y otro beige',
        fotos: [{ foto: 'F0058', etiqueta: 'Naranja', foco: '45% 60%' }, { foto: 'F0774', etiqueta: 'Beige', foco: '40% 70%' }], alto: 520 },
      { id: '03-mehari-2', tipo: 'foto', foto: 'F0834', foco: '50% 50%', arriba: true, kicker: 'Un clásico',
        titulo: 'Desde 1968', cuerpo: 'El Méhari se fabricó entre 1968 y 1988, en varios países y también en España. Salieron unas 145.000 unidades.' },
      { id: '03-mehari-3', tipo: 'foto', foto: 'F0214', foco: '40% 50%', kicker: 'Por dentro',
        titulo: 'Sencillo y descapotable', cuerpo: 'Carrocería de plástico, puertas acanaladas y un interior pensado para ir al aire libre.' },
      { id: '03-mehari-4', tipo: 'varias', kicker: 'Los Méhari', titulo: 'Tres techos',
        fotos: [{ foto: 'F0345', etiqueta: 'Abierto', foco: '50% 45%' }, { foto: 'F0750', etiqueta: 'Semiabierto', foco: '60% 40%' }, { foto: 'F1163', etiqueta: 'Cerrado, con techo solar', foco: '55% 45%' }], alto: 330,
        cuerpo: 'Si el día sale dudoso, lo cerramos.' },
      { id: '03-mehari-5', tipo: 'varias', kicker: 'Los Méhari', titulo: 'Dos cestas de mimbre',
        fotos: [{ foto: 'F2067', etiqueta: 'Así van', foco: '50% 100%' }, { foto: 'F1725', etiqueta: 'Así quedan', foco: '50% 60%' }], alto: 500,
        cuerpo: 'Van detrás, para llenarlas con las flores de vuestra boda.' },
      { id: '03-mehari-6', tipo: 'varias', kicker: 'Encuesta', titulo: '¿Cuál os gusta más?',
        fotos: [{ foto: 'F1839', etiqueta: 'Naranja', foco: '50% 55%' }, { foto: 'F0524', etiqueta: 'Beige', foco: '45% 55%' }], alto: 470, encuesta: true },
    ]},
    { nombre: '4 · Reservar', historias: [
      { id: '04-reservar-1', tipo: 'tarjeta', foto: 'F2194', alto: 690, kicker: 'Reservar',
        titulo: 'Pedir fecha, en tres pasos', cuerpo: 'Sin formularios: todo por WhatsApp.' },
      { id: '04-reservar-2', tipo: 'texto', fondo: 'naranja', kicker: 'Paso 1',
        titulo: 'Escribidnos', cuerpo: 'Por WhatsApp, con estos datos:',
        lista: ['Fecha de la boda', 'Iglesia o lugar de la ceremonia', 'Lugar de la celebración', '¿Conducís vosotros o con chófer?', '¿Naranja o beige?'] },
      { id: '04-reservar-3', tipo: 'texto', fondo: 'cal', kicker: 'Pasos 2 y 3',
        titulo: 'Os respondemos', lista: ['Os decimos si tenemos la fecha libre', 'Os pasamos el presupuesto para vuestro recorrido', 'Os explicamos cómo dejarla reservada'] },
      { id: '04-reservar-4', tipo: 'foto', foto: 'F0619', foco: '65% 50%', kicker: 'Reservar',
        titulo: 'Solo hay dos coches', cuerpo: 'Cuanto antes nos escribáis, más fácil es tener vuestra fecha.', cta: WA, sticker: true },
    ]},
    { nombre: '5 · Preguntas', historias: [
      { id: '05-preguntas-1', tipo: 'tarjeta', foto: 'F0750', alto: 690, kicker: 'Preguntas',
        titulo: 'Lo que más nos preguntáis', cuerpo: 'Pasad para ver las respuestas.' },
      { id: '05-preguntas-2', tipo: 'foto', foto: 'F1163', foco: '50% 50%', arriba: true, kicker: 'Pregunta',
        titulo: '¿Y si llueve?', cuerpo: 'Tiene techo cerrado, con techo solar. Si sale el sol, lo abrimos.' },
      { id: '05-preguntas-3', tipo: 'foto', foto: 'F2041', foco: '60% 50%', kicker: 'Pregunta',
        titulo: '¿Lo podemos conducir nosotros?', cuerpo: 'Sí. Antes de la boda os damos una clase. Y si preferís, os lleva nuestro chófer.' },
      { id: '05-preguntas-4', tipo: 'foto', foto: 'F0047', foco: '35% 50%', kicker: 'Pregunta',
        titulo: '¿Se puede decorar?', cuerpo: 'Sí. Lleva dos cestas de mimbre detrás para llenarlas con las flores de vuestra boda.' },
      { id: '05-preguntas-5', tipo: 'foto', foto: 'F0774', foco: '30% 50%', kicker: 'Pregunta',
        titulo: '¿Dónde trabajáis?', cuerpo: 'Hoy, sobre todo en Sevilla y Cádiz, en haciendas e iglesias. ¿Os casáis en otro sitio? Preguntadnos.' },
      { id: '05-preguntas-6', tipo: 'foto', foto: 'F0538', foco: '50% 50%', arriba: true, kicker: 'Pregunta',
        titulo: '¿Cuánto cuesta?', cuerpo: 'Depende de la fecha y del recorrido. Escribidnos y os pasamos presupuesto.' },
      { id: '05-preguntas-7', tipo: 'texto', fondo: 'tinta', kicker: 'Pregunta',
        titulo: '¿Con cuánta antelación?', cuerpo: 'Solo tenemos dos coches. Cuanto antes nos digáis la fecha, más fácil será tenerla libre.', cta: WA, sticker: true },
      { id: '05-preguntas-8', tipo: 'texto', fondo: 'cal', kicker: 'Preguntas',
        titulo: '¿Os queda alguna duda?', cuerpo: 'Escribidla aquí y os contestamos.', pregunta: true },
    ]},
    { nombre: '6 · Sevilla', historias: [
      { id: '06-sevilla-1', tipo: 'foto', foto: 'F0005', foco: '50% 40%', arriba: true, kicker: 'Sevilla Experience',
        titulo: 'Sevilla en Méhari', ingles: 'Seville in a classic Méhari' },
      { id: '06-sevilla-2', tipo: 'foto', foto: 'F0448', foco: '55% 45%', kicker: 'Sevilla Experience',
        titulo: 'Os recogemos en el hotel', cuerpo: 'De 2 h a 2 h 30, con chófer.', ingles: 'We pick you up at your hotel. 2 to 2.5 hours, with a driver.' },
      { id: '06-sevilla-3', tipo: 'foto', foto: 'F0009', foco: '50% 45%', arriba: true, kicker: 'Sevilla Experience',
        titulo: 'Dos tours', cuerpo: 'Monumental y Romántico/Iluminado, con paradas en Plaza de América y Plaza de España.', ingles: 'Monumental tour and Romantic/Illuminated tour, with stops at Plaza de América and Plaza de España.' },
      { id: '06-sevilla-4', tipo: 'foto', foto: 'F0180', foco: '50% 40%', arriba: true, kicker: 'Sevilla Experience',
        titulo: 'Hasta 3 por coche', cuerpo: 'De 1 a 6 personas. El mismo precio de 1 a 3.', ingles: 'Up to 3 per car, 1 to 6 guests. Same price for 1 to 3.' },
      { id: '06-sevilla-5', tipo: 'tarjeta', foto: 'F0015', alto: 640, kicker: 'Sevilla Experience',
        titulo: 'Reservad por WhatsApp', ingles: 'Book on WhatsApp', cta: WA_EN, sticker: true },
    ]},
  ];

  const src = (f) => `limpias/${f}.jpg`;
  const textos = (h) => `
    <div class="kicker">${h.kicker}</div>
    <div class="titulo">${h.titulo}</div>
    ${h.cuerpo ? `<div class="cuerpo">${h.cuerpo}</div>` : ''}
    ${h.ingles ? `<div class="ingles">${h.ingles}</div>` : ''}
    ${h.lista ? `<ul class="lista">${h.lista.map((l) => `<li>${l}</li>`).join('')}</ul>` : ''}
    ${h.cta ? `<div><span class="cta">${h.cta}</span></div>` : ''}`;

  function historia(h) {
    if (h.tipo === 'foto') {
      return `<div class="historia foto${h.arriba ? ' arriba' : ''}">
        <img src="${src(h.foto)}" style="object-position:${h.foco || '50% 50%'}" alt="">
        <div class="bloque">${textos(h)}</div></div>`;
    }
    if (h.tipo === 'tarjeta') {
      return `<div class="historia tarjeta">
        <div class="marco" style="height:${h.alto || 690}px"><img src="${src(h.foto)}" alt=""></div>
        <div class="bloque">${textos(h)}</div></div>`;
    }
    if (h.tipo === 'varias') {
      const celdas = h.fotos.map((f) => `<div class="celda" style="height:${h.alto}px">
        <img src="${src(f.foto)}" style="object-position:${f.foco || '50% 50%'}" alt=""><span class="etiqueta">${f.etiqueta}</span></div>`);
      // En la encuesta queda un hueco entre las dos fotos para el sticker de Instagram
      const rejilla = h.encuesta ? `${celdas[0]}<div style="height:150px"></div>${celdas[1]}` : celdas.join('');
      return `<div class="historia varias">
        <div class="bloque"><div class="kicker">${h.kicker}</div><div class="titulo">${h.titulo}</div>${h.cuerpo ? `<div class="cuerpo" style="margin-top:18px">${h.cuerpo}</div>` : ''}</div>
        <div class="rejilla">${rejilla}</div></div>`;
    }
    return `<div class="historia texto ${h.fondo}">
      <div class="bloque">${textos(h)}</div>
      </div>`;
  }

  const params = new URLSearchParams(location.search);
  const app = document.getElementById('app');
  const todas = SECCIONES.flatMap((s) => s.historias);
  if (params.has('id')) {
    const h = todas.find((x) => x.id === params.get('id'));
    document.body.style.cssText = 'width:1080px;height:1920px;overflow:hidden';
    app.innerHTML = h ? historia(h) : '';
  } else {
    app.innerHTML = `<main class="galeria"><h1>Historias de destacadas · Mehari We</h1>
      <p>${todas.length} historias en el orden de subida. Las fotos salen de limpias/ (matrículas y emblemas ya difuminados).</p>
      ${SECCIONES.map((s) => `<h2>${s.nombre}</h2><div class="fila">${s.historias.map((h) => `
        <div><div class="mini">${historia(h)}</div><div class="mini-id">${h.id}</div></div>`).join('')}</div>`).join('')}
    </main>`;
  }
  window.HISTORIAS = todas.map((h) => h.id);
</script>
</body>
</html>
