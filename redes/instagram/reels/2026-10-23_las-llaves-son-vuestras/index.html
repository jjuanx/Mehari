<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Reel · Las llaves son vuestras</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.woff2") format("woff2"); font-weight: 300 700; }
      @font-face { font-family: "Jost"; src: url("assets/fonts/Jost.woff2") format("woff2"); font-weight: 300 800; }
      /* Paleta de marca/tokens.css (propuesta) */
      :root {
        --naranja: #EE7D1F; --naranja-oscuro: #C2560E; --beige: #DCC6A0;
        --cal: #F7F1E6; --tinta: #2B211A; --azahar: #FFFCF5;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--tinta); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--tinta); font-family: "Jost", sans-serif; }

      video.plano { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* Rótulos (v2): casi el doble de grandes que en la v1 y colocados plano a plano donde no
         tapan caras. Siempre dentro de la zona segura de Instagram: libres la franja de arriba,
         la de abajo (desde 1480 px, texto y usuario) y la columna derecha de botones. */
      .rotulo { position: absolute; left: 72px; width: 860px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
      .rotulo.abajo { top: 1060px; }
      .rotulo.arriba { top: 270px; }
      .linea { display: inline-block; }
      .principal { font-family: "Fraunces", serif; font-weight: 600; font-size: 92px; line-height: 1.04; color: var(--azahar); background: rgba(43, 33, 26, 0.9); padding: 18px 34px 26px; border-radius: 12px; }
      .secundaria { font-weight: 600; font-size: 54px; line-height: 1.12; color: var(--tinta); background: var(--naranja); padding: 14px 30px 18px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-start="0" data-duration="18" data-width="1080" data-height="1920">

      <!-- Pista 0: seis planos en corte seco sobre una rejilla de 0,5 s (120 BPM). La v2 quita el
           plano del chófer (V140): contradecía el gancho. Sin sonido original; la música se pone en Instagram. -->
      <video id="e1" class="clip plano" src="assets/clips/e1_v139a.mp4" data-start="0" data-duration="3" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="e2" class="clip plano" src="assets/clips/e2_v139b.mp4" data-start="3" data-duration="3" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="e4" class="clip plano" src="assets/clips/e4_v084.mp4" data-start="6" data-duration="3" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="e5" class="clip plano" src="assets/clips/e5_v023.mp4" data-start="9" data-duration="2.5" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="e6" class="clip plano" src="assets/clips/e6_v144.mp4" data-start="11.5" data-duration="2.5" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="e7" class="clip plano" src="assets/clips/e7_v132.mp4" data-start="14" data-duration="2.5" data-media-start="0" data-track-index="0" playsinline muted></video>

      <!-- Pista 1: cierre de marca corto (1,5 s). La llamada a la acción ya va sobre el último plano -->
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre-corto.html" data-start="16.5" data-duration="1.5" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Pista 2: rótulos, uno por plano -->
      <div id="r1" class="clip rotulo abajo" data-start="0" data-duration="3" data-track-index="2">
        <span class="linea principal">¿Y si conducís vosotros?</span>
        <span class="linea secundaria">al salir de la iglesia</span>
      </div>
      <div id="r2" class="clip rotulo abajo" data-start="3" data-duration="3" data-track-index="2">
        <span class="linea principal">Con una clase antes de la boda</span>
      </div>
      <div id="r4" class="clip rotulo arriba" data-start="6" data-duration="3" data-track-index="2">
        <span class="linea principal">Las cestas, con vuestras flores</span>
      </div>
      <div id="r5" class="clip rotulo abajo" data-start="9" data-duration="2.5" data-track-index="2">
        <span class="linea principal">Naranja…</span>
      </div>
      <div id="r6" class="clip rotulo arriba" data-start="11.5" data-duration="2.5" data-track-index="2">
        <span class="linea principal">…o beige</span>
      </div>
      <div id="r7" class="clip rotulo abajo" data-start="14" data-duration="2.5" data-track-index="2">
        <span class="linea principal">¿Os casáis en 2027?</span>
        <span class="linea secundaria">Escribidnos vuestra fecha</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Rótulos: cada línea se descubre de izquierda a derecha y se asienta sin rebote.
      // El gancho aparece casi de inmediato para que se lea en el primer segundo.
      const oculto = { clipPath: "inset(0 100% 0 0)", x: -16 };
      const visible = { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.42, ease: "expo.out" };
      const principales = [["#r1 .principal", 0.03], ["#r2 .principal", 3.12], ["#r4 .principal", 6.12], ["#r5 .principal", 9.12], ["#r6 .principal", 11.62], ["#r7 .principal", 14.08]];
      const secundarias = [["#r1 .secundaria", 0.3], ["#r7 .secundaria", 14.4]];
      principales.concat(secundarias).forEach(([sel, t]) => tl.fromTo(sel, oculto, visible, t));

      window.__timelines["reel"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
