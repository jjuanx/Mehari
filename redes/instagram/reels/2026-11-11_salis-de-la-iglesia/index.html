<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Reel · Salís de la iglesia y…</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.woff2") format("woff2"); font-weight: 300 700; }
      @font-face { font-family: "Jost"; src: url("assets/fonts/Jost.woff2") format("woff2"); font-weight: 300 800; }
      /* Paleta de marca/tokens.css. Tipografías provisionales (Fraunces y Jost) */
      :root {
        --naranja: #EE7D1F; --naranja-oscuro: #C2560E; --beige: #DCC6A0;
        --cal: #F7F1E6; --tinta: #2B211A; --azahar: #FFFCF5;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--tinta); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--tinta); font-family: "Jost", sans-serif; }

      video.plano { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* Rótulos con el estilo de la v2 de «Las llaves son vuestras», dentro de la zona segura de Instagram
         (libres la franja de arriba, la de abajo desde 1480 px y la columna derecha). */
      .rotulo { position: absolute; left: 72px; width: 860px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
      .rotulo.abajo { top: 1060px; }
      .rotulo.arriba { top: 250px; }
      .linea { display: inline-block; }
      .principal { font-family: "Fraunces", serif; font-weight: 600; font-size: 92px; line-height: 1.04; color: var(--azahar); background: rgba(43, 33, 26, 0.9); padding: 18px 34px 26px; border-radius: 12px; }
      .secundaria { font-weight: 600; font-size: 54px; line-height: 1.12; color: var(--tinta); background: var(--naranja); padding: 14px 30px 18px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-start="0" data-duration="15" data-width="1080" data-height="1920">

      <!-- Pista 0: Live Photos de la boda del 24-10 en el orden del día, recortadas a 9:16 y con la funda
           de la marca antigua, la matrícula y el chevrón fuera del encuadre (en 4049, difuminada; en 4079, funda lisa fotograma a fotograma). El sonido se mezcla aparte (BRIEF.md). -->
      <video id="p1" class="clip plano" src="assets/clips/e1_4041_salida.mp4" data-start="0" data-duration="2.9" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="p2" class="clip plano" src="assets/clips/e2_4101_cestas.mp4" data-start="2.9" data-duration="1.9" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="p3" class="clip plano" src="assets/clips/e3_4049_detras.mp4" data-start="4.8" data-duration="2.8" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="p4" class="clip plano" src="assets/clips/e4_4073_llegada.mp4" data-start="7.6" data-duration="2.5" data-media-start="0" data-track-index="0" playsinline muted></video>
      <video id="p5" class="clip plano" src="assets/clips/e5_4079_fiesta.mp4" data-start="10.1" data-duration="2.8" data-media-start="0" data-track-index="0" playsinline muted></video>

      <!-- Pista 1: cierre de marca corto con el logo aprobado (2,1 s) -->
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre-corto.html" data-start="12.9" data-duration="2.1" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Pista 2: rótulos. Una frase partida en dos planos: «Salís de la iglesia y…» / «…os espera vuestro Méhari» -->
      <div id="r1" class="clip rotulo arriba" data-start="0" data-duration="2.9" data-track-index="2">
        <span class="linea principal">Salís de la iglesia y…</span>
      </div>
      <div id="r2" class="clip rotulo arriba" data-start="2.9" data-duration="1.9" data-track-index="2">
        <span class="linea principal">…os espera vuestro Méhari</span>
      </div>
      <div id="r3" class="clip rotulo abajo" data-start="4.8" data-duration="2.8" data-track-index="2">
        <span class="linea principal">Con chófer</span>
        <span class="linea secundaria">y el techo abierto</span>
      </div>
      <div id="r4" class="clip rotulo arriba" data-start="7.6" data-duration="2.5" data-track-index="2">
        <span class="linea principal">Llegáis a la finca</span>
      </div>
      <div id="r5" class="clip rotulo arriba" data-start="10.1" data-duration="2.8" data-track-index="2">
        <span class="linea principal">y empieza la fiesta</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Cada línea se descubre de izquierda a derecha y se asienta sin rebote, justo después del corte.
      const oculto = { clipPath: "inset(0 100% 0 0)", x: -16 };
      const visible = { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.42, ease: "expo.out" };
      [["#r1 .principal", 0.03], ["#r2 .principal", 2.95], ["#r3 .principal", 4.85], ["#r3 .secundaria", 5.2],
       ["#r4 .principal", 7.65], ["#r5 .principal", 10.15]]
        .forEach(([sel, t]) => tl.fromTo(sel, oculto, visible, t));

      window.__timelines["reel"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
