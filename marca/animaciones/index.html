<!DOCTYPE html>
<html lang="es" data-composition-variables="[
  {&quot;id&quot;:&quot;marca&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Nombre de la marca&quot;,&quot;default&quot;:&quot;[MARCA POR DEFINIR]&quot;},
  {&quot;id&quot;:&quot;whatsapp&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;WhatsApp&quot;,&quot;default&quot;:&quot;[WHATSAPP POR DEFINIR]&quot;}
]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Cierre de reel · costillas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.woff2") format("woff2"); font-weight: 300 700; }
      @font-face { font-family: "Jost"; src: url("assets/fonts/Jost.woff2") format("woff2"); font-weight: 300 800; }
      /* Paleta de marca/tokens.css (propuesta) */
      :root {
        --naranja: #EE7D1F; --naranja-oscuro: #C2560E; --beige: #DCC6A0;
        --cal: #F7F1E6; --tinta: #2B211A; --azahar: #FFFCF5;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--tinta); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--tinta); font-family: "Jost", sans-serif; }
      #escena { position: absolute; inset: 0; }

      /* Fondo: líneas finas que recuerdan las costillas */
      .fondo { position: absolute; left: -60px; right: -60px; height: 3px; background: var(--naranja-oscuro); opacity: 0.22; }

      /* Muro de costillas: mismas alturas que las bandas del símbolo */
      .costilla { position: absolute; left: 0; width: 1080px; background: var(--naranja); transform-origin: 50% 50%; }

      /* Símbolo C2 (viewBox 200 → 420 px) */
      #simbolo { position: absolute; left: 330px; top: 560px; width: 420px; height: 420px; }

      /* Textos */
      .textos { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 1110px 110px 0; gap: 22px; }
      .mascara { overflow: hidden; padding-bottom: 6px; }
      #marca { display: block; font-family: "Fraunces", serif; font-weight: 500; font-size: 72px; line-height: 1.1; color: var(--azahar); text-align: center; }
      #zona { font-weight: 600; font-size: 26px; letter-spacing: 0.4em; color: var(--beige); margin-bottom: 34px; }
      #cta { font-weight: 600; font-size: 34px; color: var(--tinta); background: var(--naranja); padding: 26px 44px; border-radius: 999px; }
      #whatsapp { font-weight: 500; font-size: 28px; color: var(--beige); }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-oaip" id="root" data-composition-id="cierre" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <section data-hf-id="hf-0gm3" id="escena" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div data-hf-id="hf-78ne" id="fondo-1" class="fondo" style="top: 230px"></div>
        <div data-hf-id="hf-hwg6" id="fondo-2" class="fondo" style="top: 262px"></div>
        <div data-hf-id="hf-mq6e" id="fondo-3" class="fondo" style="top: 294px"></div>
        <div data-hf-id="hf-c2y7" id="fondo-4" class="fondo" style="top: 1640px"></div>
        <div data-hf-id="hf-w8gd" id="fondo-5" class="fondo" style="top: 1672px"></div>
        <div data-hf-id="hf-uhg8" id="fondo-6" class="fondo" style="top: 1704px"></div>

        <div data-hf-id="hf-73av" id="costilla-1" class="costilla" style="top: 644px; height: 55px"></div>
        <div data-hf-id="hf-w7kp" id="costilla-2" class="costilla" style="top: 722px; height: 31px"></div>
        <div data-hf-id="hf-9xv5" id="costilla-3" class="costilla" style="top: 776px; height: 31px"></div>
        <div data-hf-id="hf-ix0o" id="costilla-4" class="costilla" style="top: 831px; height: 44px"></div>

        <svg data-hf-id="hf-brbr" id="simbolo" viewBox="0 0 200 200" aria-hidden="true">
          <defs data-hf-id="hf-mh0t">
            <mask data-hf-id="hf-zexg" id="huecos" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
              <rect data-hf-id="hf-vye2" width="200" height="200" fill="#fff" />
              <rect data-hf-id="hf-cnit" x="0" y="66" width="200" height="11" fill="#000" />
              <rect data-hf-id="hf-anrc" x="0" y="92" width="200" height="11" fill="#000" />
              <rect data-hf-id="hf-ipu9" x="0" y="118" width="200" height="11" fill="#000" />
            </mask>
          </defs>
          <path data-hf-id="hf-b5x9" mask="url(#huecos)" fill="var(--naranja)" d="M24 58 Q24 40 42 40 L176 40 L176 150 L156 150 A42 42 0 0 0 72 150 L24 150 Z" />
          <g data-hf-id="hf-55z9" id="rueda-rodar"><g data-hf-id="hf-3bhk" id="rueda">
            <circle data-hf-id="hf-3p6r" cx="114" cy="156" r="34" fill="var(--beige)" />
            <circle data-hf-id="hf-91s4" cx="114" cy="156" r="11" fill="var(--tinta)" />
            <circle data-hf-id="hf-k8uv" cx="114" cy="135" r="3.5" fill="var(--tinta)" />
            <circle data-hf-id="hf-i9gj" cx="132" cy="166" r="3.5" fill="var(--tinta)" />
            <circle data-hf-id="hf-9kua" cx="96" cy="166" r="3.5" fill="var(--tinta)" />
          </g></g>
        </svg>

        <div data-hf-id="hf-px2b" class="textos">
          <div data-hf-id="hf-lajz" class="mascara" data-layout-allow-overflow="true"><span data-hf-id="hf-gqp5" id="marca" data-var-text="marca">[MARCA POR DEFINIR]</span></div>
          <p data-hf-id="hf-kcs0" id="zona">SEVILLA · CÁDIZ</p>
          <p data-hf-id="hf-rp4p" id="cta">Pide disponibilidad para tu fecha</p>
          <p data-hf-id="hf-sqhx" id="whatsapp">WhatsApp · <span data-hf-id="hf-z2mn" data-var-text="whatsapp">[WHATSAPP POR DEFINIR]</span></p>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Fondo: deriva lenta y continua (una sola motivación ambiental)
      tl.fromTo(["#fondo-1", "#fondo-3", "#fondo-5"], { x: -40 }, { x: 40, duration: 4, ease: "none" }, 0);
      tl.fromTo(["#fondo-2", "#fondo-4", "#fondo-6"], { x: 40 }, { x: -40, duration: 4, ease: "none" }, 0);

      // Build: las costillas entran desde lados alternos, en cascada
      ["#costilla-1", "#costilla-2", "#costilla-3", "#costilla-4"].forEach((id, i) => {
        tl.fromTo(id, { x: i % 2 ? 1180 : -1180 }, { x: 0, duration: 0.55, ease: "expo.out" }, 0.15 + i * 0.07);
      });

      // Las costillas se estrechan hasta el ancho del símbolo y se funden en él
      tl.fromTo(".costilla", { scaleX: 1 }, { scaleX: 0.2956, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 0.95);
      tl.fromTo("#simbolo", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "sine.out" }, 1.36);
      tl.fromTo(".costilla", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "sine.in", immediateRender: false }, 1.44);

      // La rueda entra rodando desde la derecha
      tl.fromTo("#rueda-rodar", { x: 130 }, { x: 0, duration: 0.6, ease: "back.out(1.3)" }, 1.32);
      tl.fromTo("#rueda", { rotation: 220, transformOrigin: "50% 50%" }, { rotation: 0, transformOrigin: "50% 50%", duration: 0.6, ease: "power3.out" }, 1.32);
      // Breathe: la rueda sigue girando despacio
      tl.fromTo("#rueda", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: -40, transformOrigin: "50% 50%", duration: 2.08, ease: "sine.inOut", immediateRender: false }, 1.92);

      // Textos: cada uno con su entrada
      tl.fromTo("#marca", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 1.62);
      tl.fromTo("#zona", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, 1.9);
      tl.fromTo("#cta", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.1);
      tl.fromTo("#whatsapp", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 2.35);

      window.__timelines["cierre"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
