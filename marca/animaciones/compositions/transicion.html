<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Transición de costillas (con transparencia)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --naranja: #EE7D1F; --naranja-oscuro: #C2560E; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #escena { position: absolute; inset: 0; }
      /* 8 franjas de 240 px: a los 0,4 s cubren toda la pantalla (punto de corte) */
      .franja { position: absolute; left: 0; width: 1080px; height: 242px; }
      .franja.clara { background: var(--naranja); }
      .franja.oscura { background: var(--naranja-oscuro); }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-cygq" id="root" data-composition-id="transicion" data-start="0" data-duration="0.85" data-width="1080" data-height="1920">
      <section data-hf-id="hf-ci4c" id="escena" class="clip" data-start="0" data-duration="0.85" data-track-index="0">
        <div data-hf-id="hf-bq5i" id="franja-1" class="franja clara" style="top: 0px"></div>
        <div data-hf-id="hf-xp1t" id="franja-2" class="franja oscura" style="top: 240px"></div>
        <div data-hf-id="hf-cl84" id="franja-3" class="franja clara" style="top: 480px"></div>
        <div data-hf-id="hf-oq48" id="franja-4" class="franja oscura" style="top: 720px"></div>
        <div data-hf-id="hf-yfrh" id="franja-5" class="franja clara" style="top: 960px"></div>
        <div data-hf-id="hf-u4gc" id="franja-6" class="franja oscura" style="top: 1200px"></div>
        <div data-hf-id="hf-kp6f" id="franja-7" class="franja clara" style="top: 1440px"></div>
        <div data-hf-id="hf-84jm" id="franja-8" class="franja oscura" style="top: 1680px"></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      for (let i = 0; i < 8; i++) {
        const id = `#franja-${i + 1}`;
        const lado = i % 2 ? 1 : -1; // entran desde lados alternos
        // Entrada: cubren la pantalla a los 0,38 s
        tl.fromTo(id, { x: lado * 1100 }, { x: 0, duration: 0.24, ease: "expo.out" }, 0.02 * i);
        // Salida: siguen su camino y salen por el lado contrario
        tl.fromTo(id, { x: 0 }, { x: -lado * 1100, duration: 0.24, ease: "expo.in", immediateRender: false }, 0.44 + 0.02 * i);
      }
      window.__timelines["transicion"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
